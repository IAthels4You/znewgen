<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0c14"/>
      <stop offset="55%" stop-color="#1e1a29"/>
      <stop offset="100%" stop-color="#382524"/>
    </linearGradient>
    <radialGradient id="domeGlow" cx="62%" cy="86%" r="58%">
      <stop offset="0%" stop-color="#f7c86a" stop-opacity="0.46"/>
      <stop offset="48%" stop-color="#d48c3b" stop-opacity="0.18"/>
      <stop offset="82%" stop-color="#e5b869" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d0c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7ad" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f0a848" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f0a848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8be9fd" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#mSky)"/>
  <rect width="1600" height="620" fill="url(#domeGlow)"/>

  <!-- Twilight Stars -->
  <g fill="#f6e4c1" opacity="0.5">
    <circle cx="120" cy="80" r="1.4"/><circle cx="310" cy="120" r="1.1"/><circle cx="520" cy="65" r="1.5"/>
    <circle cx="780" cy="95" r="1.2"/><circle cx="1180" cy="70" r="1.5"/><circle cx="1410" cy="115" r="1.3"/>
  </g>

  <!-- Distant silhouettes -->
  <path d="M0,450 L220,390 L480,435 L760,370 L1080,425 L1360,365 L1600,415 L1600,620 L0,620 Z" fill="#18141e"/>

  <!-- Translucent Golden SafeZone Dome (Z-MARKET Signature) -->
  <g transform="translate(990, 520)">
    <path d="M-470,0 A470,410 0 0,1 470,0" fill="url(#domeGlow)" stroke="#f5c66c" stroke-width="2.2" stroke-opacity="0.52"/>
    <path d="M-470,0 A470,410 0 0,1 470,0" fill="none" stroke="#ffe5a3" stroke-width="6" stroke-opacity="0.16" filter="url(#blurM)"/>
    <!-- Subtle geodesic ribs -->
    <path d="M-340,0 A340,410 0 0,1 340,0" fill="none" stroke="#f5c66c" stroke-width="1" stroke-opacity="0.16"/>
    <path d="M-190,0 A190,410 0 0,1 190,0" fill="none" stroke="#f5c66c" stroke-width="1" stroke-opacity="0.14"/>
    <ellipse cx="0" cy="-140" rx="440" ry="38" fill="none" stroke="#f5c66c" stroke-width="1" stroke-opacity="0.15"/>
    <ellipse cx="0" cy="-275" rx="345" ry="28" fill="none" stroke="#f5c66c" stroke-width="1" stroke-opacity="0.14"/>
  </g>

  <!-- Market Pavilion Architecture & Tek Teleporter Pad -->
  <g fill="#131017" stroke="#e5b869" stroke-opacity="0.22" stroke-width="1.2">
    <!-- Main Sanctuary Pavilion -->
    <polygon points="780,520 820,415 1160,415 1200,520"/>
    <polygon points="755,420 990,348 1225,420"/>
    <rect x="845" y="445" width="46" height="75" fill="#2d1f18" stroke="#f5c66c" stroke-opacity="0.45"/>
    <rect x="965" y="438" width="54" height="82" fill="#3a271c" stroke="#f5c66c" stroke-opacity="0.55"/>
    <rect x="1090" y="445" width="46" height="75" fill="#2d1f18" stroke="#f5c66c" stroke-opacity="0.45"/>
    <!-- Side Bazaar Stalls -->
    <polygon points="590,520 605,465 735,465 750,520"/>
    <polygon points="1245,520 1260,468 1385,468 1400,520"/>
  </g>

  <!-- Glowing Tek Teleporter Pad (0-Fuel Sanctuary) -->
  <ellipse cx="670" cy="524" rx="76" ry="14" fill="url(#tpGlow)"/>
  <ellipse cx="670" cy="524" rx="52" ry="8" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-opacity="0.75"/>

  <!-- Warm Café-Style Lantern Bokeh Orbs -->
  <circle cx="868" cy="465" r="46" fill="url(#lantern)"/>
  <circle cx="992" cy="462" r="64" fill="url(#lantern)"/>
  <circle cx="1113" cy="465" r="46" fill="url(#lantern)"/>
  <circle cx="725" cy="472" r="36" fill="url(#lantern)"/>
  <circle cx="1275" cy="472" r="36" fill="url(#lantern)"/>

  <!-- Ground Foreground -->
  <rect x="0" y="518" width="1600" height="102" fill="#0f0d13"/>
  <ellipse cx="990" cy="524" rx="460" ry="18" fill="#f5c66c" opacity="0.14" filter="url(#blurM)"/>
</svg>
