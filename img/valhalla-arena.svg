<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="vSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090710"/>
      <stop offset="42%" stop-color="#22112b"/>
      <stop offset="76%" stop-color="#4e1828"/>
      <stop offset="100%" stop-color="#190e14"/>
    </linearGradient>
    <radialGradient id="vCore" cx="56%" cy="74%" r="48%">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#d9464f" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#7e22ce" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090710" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="altarBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="vGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="vTight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#vSky)"/>
  <rect width="1600" height="620" fill="url(#vCore)"/>

  <!-- Storm Lightning Crack -->
  <polyline points="1180,0 1142,88 1172,112 1118,215 1138,225 1098,310" fill="none" stroke="#f8d8ff" stroke-width="2.4" opacity="0.55" filter="url(#vTight)"/>
  <polyline points="420,0 448,72 426,94 468,185" fill="none" stroke="#ffd8a8" stroke-width="1.8" opacity="0.36" filter="url(#vTight)"/>

  <!-- Outer Translucent Valhalla Arena Dome -->
  <path d="M90,520 A710,480 0 0,1 1510,520" fill="none" stroke="#c084fc" stroke-width="2.4" stroke-opacity="0.42"/>
  <path d="M90,520 A710,480 0 0,1 1510,520" fill="none" stroke="#f43f5e" stroke-width="8" stroke-opacity="0.16" filter="url(#vGlow)"/>

  <!-- Colossal Guardian Titan Silhouette in Center Mist -->
  <g transform="translate(895, 515)" opacity="0.88">
    <path d="M-125,0 L-105,-145 L-158,-225 L-98,-278 L-55,-248 L-28,-315 L0,-332 L32,-312 L62,-246 L112,-272 L162,-212 L106,-142 L128,0 Z" fill="#140c16" stroke="#f5b942" stroke-opacity="0.28" stroke-width="1.4"/>
    <!-- Glowing Alpha / Ice-Fire Eyes & Core -->
    <circle cx="-11" cy="-296" r="4" fill="#ffe08a" filter="url(#vTight)"/>
    <circle cx="12" cy="-296" r="4" fill="#ffe08a" filter="url(#vTight)"/>
    <polygon points="0,-232 22,-188 0,-152 -22,-188" fill="#fb923c" opacity="0.65" filter="url(#vGlow)"/>
    <!-- Golden Supreme Vault Dome at Titan's Feet -->
    <path d="M-84,0 A84,68 0 0,1 84,0" fill="#f5b942" fill-opacity="0.18" stroke="#fcd34d" stroke-width="2" stroke-opacity="0.72"/>
  </g>

  <!-- 3 Blue Conquest Altars (Signature Valhalla Phase 2) -->
  <g>
    <!-- Altar 1 (Left) -->
    <rect x="448" y="210" width="24" height="310" fill="url(#altarBeam)" filter="url(#vGlow)"/>
    <rect x="457" y="240" width="6" height="280" fill="#e0f2fe" opacity="0.8"/>
    <path d="M390,520 A70,56 0 0,1 530,520" fill="#38bdf8" fill-opacity="0.14" stroke="#7dd3fc" stroke-width="1.8" stroke-opacity="0.75"/>
    <!-- Altar 2 (Right-Center) -->
    <rect x="1198" y="220" width="24" height="300" fill="url(#altarBeam)" filter="url(#vGlow)"/>
    <rect x="1207" y="250" width="6" height="270" fill="#e0f2fe" opacity="0.8"/>
    <path d="M1140,520 A70,56 0 0,1 1280,520" fill="#38bdf8" fill-opacity="0.14" stroke="#7dd3fc" stroke-width="1.8" stroke-opacity="0.75"/>
    <!-- Altar 3 (Far Left) -->
    <rect x="228" y="295" width="18" height="225" fill="url(#altarBeam)" filter="url(#vGlow)"/>
    <path d="M185,520 A52,42 0 0,1 289,520" fill="#38bdf8" fill-opacity="0.12" stroke="#7dd3fc" stroke-width="1.4" stroke-opacity="0.65"/>
  </g>

  <!-- Flat Desert Plains & Border Flags -->
  <rect x="0" y="516" width="1600" height="104" fill="#100b11"/>
  <g stroke="#e5b869" stroke-width="2" stroke-opacity="0.55" fill="#991b1b">
    <line x1="145" y1="518" x2="145" y2="465"/><polygon points="145,468 172,477 145,486"/>
    <line x1="1455" y1="518" x2="1455" y2="465"/><polygon points="1455,468 1428,477 1455,486"/>
  </g>

  <!-- Rising Battle Embers -->
  <g fill="#f5b942" filter="url(#vTight)">
    <circle cx="720" cy="420" r="2.6" opacity="0.8"/>
    <circle cx="840" cy="360" r="2.2" opacity="0.7"/>
    <circle cx="965" cy="395" r="2.8" opacity="0.82"/>
    <circle cx="1050" cy="440" r="2.0" opacity="0.6"/>
    <circle cx="635" cy="465" r="2.2" opacity="0.65"/>
  </g>
</svg>
