<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Z NEW GEN · Ragnarok PvP x15 [2Man]</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0a0d;
    --bg-elev: #131117;
    --card: rgba(20, 18, 24, 0.88);
    --card-solid: #141218;
    --card-hover: rgba(34, 29, 39, 0.92);
    --border: rgba(230, 185, 106, 0.14);
    --border-hi: rgba(230, 185, 106, 0.34);
    --text: #f4eee4;
    --text-soft: #ded6ca;
    --muted: #a69c8e;
    --gold: #e6b96a;
    --gold-bright: #f7d694;
    --gold-bg: rgba(230, 185, 106, 0.12);
    --emerald: #4fd1a5;
    --emerald-bg: rgba(79, 209, 165, 0.12);
    --sky: #70c6f5;
    --sky-bg: rgba(112, 198, 245, 0.12);
    --lavender: #c996fa;
    --lavender-bg: rgba(201, 150, 250, 0.13);
    --amber: #e6825e;
    --amber-bg: rgba(230, 130, 94, 0.13);
    --radius: 20px;
    --shadow: 0 22px 54px rgba(0, 0, 0, 0.55);
    --display: "Cinzel", Georgia, "Times New Roman", serif;
    --editorial: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    color: var(--text);
    background:
      radial-gradient(980px 580px at 8% 18%, rgba(230, 185, 106, 0.06), transparent 65%),
      radial-gradient(900px 540px at 92% 45%, rgba(168, 89, 52, 0.06), transparent 65%),
      var(--bg);
    line-height: 1.82;
    letter-spacing: 0.015em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Subtle warm film-grain texture (boutique editorial touch) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  @keyframes kenBurns {
    0% { transform: scale(1.0) translate3d(0, 0, 0); }
    100% { transform: scale(1.07) translate3d(-1.2%, -0.8%, 0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.82); }
  }

  /* Floating Top Navigation Bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 60;
    background: rgba(11, 10, 13, 0.78);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 13px 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.14em;
    color: var(--text);
  }
  .logo-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #f3cd82, #b87e34);
    color: #0b0a0d;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.05rem;
    box-shadow: 0 4px 16px rgba(230, 185, 106, 0.32);
  }
  .nav-links {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .nav-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 6px 13px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .nav-btn:hover { color: var(--text); background: rgba(230, 185, 106, 0.08); }
  .nav-btn.active {
    color: var(--gold-bright);
    background: rgba(230, 185, 106, 0.14);
    border-color: rgba(230, 185, 106, 0.42);
  }

  .lang-switch {
    display: flex;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-hi);
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
  }
  .lang-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.18s;
  }
  .lang-btn.active {
    background: linear-gradient(135deg, rgba(230, 185, 106, 0.26), rgba(230, 185, 106, 0.12));
    color: var(--gold-bright);
  }

  /* Full-Bleed Cinematic Editorial Hero */
  .hero-outer {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background: url("img/hero-ragnarok.svg") center center / cover no-repeat;
    animation: kenBurns 26s ease-in-out infinite alternate;
    will-change: transform;
  }
  .hero-scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(11, 10, 13, 0.56) 0%, rgba(11, 10, 13, 0.34) 38%, rgba(11, 10, 13, 0.86) 84%, #0b0a0d 100%),
      linear-gradient(90deg, rgba(11, 10, 13, 0.84) 0%, rgba(11, 10, 13, 0.46) 54%, rgba(11, 10, 13, 0.22) 100%);
  }
  .hero {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 76px 26px 46px;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: rgba(15, 14, 18, 0.72);
    backdrop-filter: blur(10px);
    color: var(--gold-bright);
    border: 1px solid rgba(230, 185, 106, 0.4);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .hero-badge::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 10px var(--emerald);
    animation: pulseDot 2.2s ease-in-out infinite;
  }
  .hero h1 {
    font-family: var(--display);
    font-size: clamp(2.15rem, 4.4vw, 3.5rem);
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1.16;
    color: #fbf6ee;
    text-shadow: 0 8px 34px rgba(0, 0, 0, 0.65);
    max-width: 840px;
  }
  .hero-rule {
    width: 92px;
    height: 1px;
    margin: 22px 0 20px;
    background: linear-gradient(90deg, var(--gold-bright), rgba(230, 185, 106, 0.1));
  }
  .hero-sub {
    font-family: var(--editorial);
    font-style: italic;
    font-weight: 500;
    color: #efe7da;
    font-size: clamp(1.22rem, 2vw, 1.44rem);
    line-height: 1.65;
    letter-spacing: 0.015em;
    max-width: 720px;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.72);
  }

  /* Hero Direct Connect & Community Action Bar */
  .hero-actions {
    margin-top: 26px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  .btn-primary, .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px;
    border-radius: 13px;
    font-family: var(--sans);
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, #f3cd82 0%, #c88e3d 100%);
    color: #0b0a0d;
    border: 1px solid rgba(255, 232, 180, 0.7);
    box-shadow: 0 10px 28px rgba(230, 185, 106, 0.28);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 34px rgba(230, 185, 106, 0.42);
  }
  .btn-secondary {
    background: rgba(16, 14, 20, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text);
    border: 1px solid rgba(230, 185, 106, 0.34);
  }
  .btn-secondary:hover {
    transform: translateY(-2px);
    border-color: var(--gold-bright);
    background: rgba(230, 185, 106, 0.14);
  }
  .btn-secondary.copied {
    border-color: var(--emerald);
    color: var(--emerald);
    background: var(--emerald-bg);
  }
  .btn-ip-code {
    font-family: var(--mono);
    font-size: 0.84rem;
    color: var(--gold-bright);
  }
  .hero-connect-note {
    margin-top: 10px;
    font-size: 0.82rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  /* Frosted Search Bar */
  .search-wrap {
    margin-top: 22px;
    max-width: 680px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 17px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--gold);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    background: rgba(15, 13, 18, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(230, 185, 106, 0.34);
    color: var(--text);
    padding: 15px 76px 15px 46px;
    border-radius: 14px;
    font-family: var(--sans);
    font-size: 0.96rem;
    outline: none;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
    transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
  }
  #searchInput::placeholder { color: #b5aa9a; }
  #searchInput:focus {
    border-color: var(--gold-bright);
    background: rgba(18, 16, 22, 0.92);
    box-shadow: 0 0 0 4px rgba(230, 185, 106, 0.16), 0 14px 36px rgba(0, 0, 0, 0.55);
  }
  .search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(230, 185, 106, 0.12);
    border: 1px solid rgba(230, 185, 106, 0.28);
    color: var(--gold-bright);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
  }

  /* Signature Luxury Strip at Hero Footer */
  .hero-strip {
    margin-top: 34px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
  }
  .hero-strip-item {
    background: rgba(16, 14, 20, 0.68);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(230, 185, 106, 0.22);
    border-radius: 14px;
    padding: 13px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .hero-strip-item span {
    font-size: 0.71rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }
  .hero-strip-item strong {
    font-size: 0.95rem;
    color: #fbf6ee;
    font-weight: 650;
  }

  /* Main Editorial Container */
  main {
    max-width: 1200px;
    margin: 0 auto 88px;
    padding: 0 26px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .section-card {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: fadeUp 0.45s ease both;
    position: relative;
  }
  .section-card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 28px;
    right: 28px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(230, 185, 106, 0.38), transparent);
    pointer-events: none;
  }

  /* Editorial Photo Banner Headers (Boutique Café / Restaurant Feel) */
  .section-banner {
    position: relative;
    min-height: 205px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    padding: 26px 32px;
    background-size: cover;
    background-position: center;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .section-banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(11, 10, 13, 0.25) 0%, rgba(11, 10, 13, 0.65) 58%, rgba(21, 19, 25, 0.98) 100%);
  }
  .section-banner > * { position: relative; z-index: 2; }
  .section-banner h2 {
    font-family: var(--display);
    font-size: clamp(1.3rem, 2.3vw, 1.65rem);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #fcf7ef;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.78);
  }

  .section-head {
    padding: 24px 36px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, rgba(230, 185, 106, 0.07), transparent 72%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .section-head h2 {
    font-family: var(--display);
    font-size: 1.24rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #fbf6ee;
  }
  .pill {
    font-family: var(--editorial);
    font-style: italic;
    font-size: 0.96rem;
    font-weight: 600;
    padding: 4px 16px;
    border-radius: 999px;
    letter-spacing: 0.04em;
    backdrop-filter: blur(8px);
  }
  .pill-sky { background: rgba(112, 198, 245, 0.14); color: var(--sky); border: 1px solid rgba(112, 198, 245, 0.35); }
  .pill-gold { background: rgba(230, 185, 106, 0.16); color: var(--gold-bright); border: 1px solid rgba(230, 185, 106, 0.42); }
  .pill-emerald { background: rgba(79, 209, 165, 0.14); color: var(--emerald); border: 1px solid rgba(79, 209, 165, 0.35); }
  .pill-lavender { background: rgba(201, 150, 250, 0.14); color: var(--lavender); border: 1px solid rgba(201, 150, 250, 0.35); }
  .pill-amber { background: rgba(230, 130, 94, 0.15); color: var(--amber); border: 1px solid rgba(230, 130, 94, 0.38); }

  .section-body { padding: 30px 36px 34px; }
  .editorial-lead {
    font-family: var(--editorial);
    font-style: italic;
    font-size: 1.22rem;
    line-height: 1.75;
    letter-spacing: 0.014em;
    color: #ede4d6;
    margin-bottom: 24px;
    max-width: 960px;
  }

  /* Grids & Tactile Cards */
  .grid-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
    gap: 18px;
  }
  .stat-box {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(11, 10, 13, 0.52));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .stat-box:hover {
    transform: translateY(-2px);
    border-color: var(--border-hi);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34);
  }
  .stat-box .label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold);
  }
  .stat-box .val {
    font-family: var(--editorial);
    font-size: 1.32rem;
    font-weight: 600;
    color: #fbf6ee;
    margin-top: 8px;
    line-height: 1.32;
    letter-spacing: 0.015em;
  }
  .stat-box .note {
    font-size: 0.91rem;
    color: var(--text-soft);
    margin-top: 10px;
    line-height: 1.82;
    letter-spacing: 0.016em;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    gap: 20px;
  }
  .feature-box {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.024), rgba(11, 10, 13, 0.48));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 26px;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .feature-box:hover {
    transform: translateY(-2px);
    border-color: var(--border-hi);
  }
  .feature-box h3 {
    font-family: var(--editorial);
    font-style: italic;
    font-size: 1.34rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--gold-bright);
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(230, 185, 106, 0.16);
  }
  .feature-box p, .feature-box li {
    font-size: 0.93rem;
    color: var(--text-soft);
    line-height: 1.86;
    letter-spacing: 0.016em;
  }
  .feature-box ul { padding-left: 20px; display: flex; flex-direction: column; gap: 12px; }
  .feature-box li::marker { color: var(--gold); }

  /* Command Menu List (Tasting Menu Rhythm) */
  .cmd-list { display: flex; flex-direction: column; }
  .cmd-row {
    display: grid;
    grid-template-columns: minmax(250px, 1fr) 1.55fr auto;
    gap: 20px;
    align-items: center;
    padding: 18px 36px;
    border-top: 1px solid rgba(230, 185, 106, 0.09);
    transition: background 0.16s ease;
  }
  .cmd-row:first-child { border-top: none; }
  .cmd-row:hover { background: var(--card-hover); }
  .cmd-code {
    font-family: var(--mono);
    font-size: 0.84rem;
    color: var(--gold-bright);
    background: rgba(8, 7, 10, 0.62);
    border: 1px solid rgba(230, 185, 106, 0.24);
    padding: 6px 12px;
    border-radius: 9px;
    display: inline-block;
  }
  .cmd-cat {
    font-family: var(--editorial);
    font-style: italic;
    font-size: 0.92rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-top: 6px;
  }
  .cmd-desc {
    font-size: 0.93rem;
    line-height: 1.78;
    letter-spacing: 0.015em;
    color: var(--text-soft);
  }

  .copy-btn {
    background: rgba(230, 185, 106, 0.08);
    border: 1px solid rgba(230, 185, 106, 0.3);
    color: var(--gold-bright);
    padding: 8px 15px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 0.79rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .copy-btn:hover { background: rgba(230, 185, 106, 0.22); border-color: var(--gold-bright); transform: translateY(-1px); }
  .copy-btn.copied { background: var(--emerald-bg); border-color: var(--emerald); color: var(--emerald); }

  /* Color Swatches */
  .swatches {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .swatch {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(11, 10, 13, 0.56);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 0.83rem;
    color: var(--text-soft);
    cursor: pointer;
    transition: border-color 0.18s, transform 0.18s, background 0.18s;
  }
  .swatch:hover {
    border-color: var(--gold-bright);
    background: rgba(230, 185, 106, 0.08);
    transform: translateY(-2px);
  }
  .dot {
    width: 19px;
    height: 19px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.38);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    flex-shrink: 0;
  }
  .swatch b { font-family: var(--mono); color: var(--gold-bright); }

  /* Rules */
  .rules-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 18px;
  }
  .rule-item {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(11, 10, 13, 0.52));
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: 13px;
    padding: 20px 22px;
    font-size: 0.93rem;
    line-height: 1.82;
    letter-spacing: 0.016em;
    color: var(--text-soft);

}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const t = CONTENT[lang];
    if (btn) {
      const oldHtml = btn.innerHTML;
      btn.textContent = t.copied;
      btn.classList.add("copied");
      setTimeout(() => { btn.innerHTML = oldHtml; btn.classList.remove("copied"); }, 1200);
    }
    const toast = document.getElementById("toast");
    toast.textContent = `${t.toastPrefix} ${text}`;
    toast.classList.add("show");
    clearTimeout(window._t);
    window._t = setTimeout(() => toast.classList.remove("show"), 1800);
  });
}

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.getElementById("btnES").classList.toggle("active", l === "es");
  document.getElementById("btnEN").classList.toggle("active", l === "en");
  render();
}

function setTab(id) {
  activeTab = id;
  render();
}

function matchesSearch(text) {
  const q = norm(query.trim());
  if (!q) return true;
  const hay = norm(text);
  return q.split(/\s+/).every(tok => hay.includes(tok));
}

  let html = "";

    const steps = t.startSteps.filter(s => matchesSearch(`${t.startHead} ${s.k} ${s.v} ${s.n}`));

            <div class="grid-2">

  // 1. Rates
  if (show("rates")) {
    const items = t.rates.filter(r => matchesSearch(`${t.ratesHead} ${r.k} ${r.v} ${r.n}`));

          <div class="section-head">

          </div>
          <div class="section-body">
            <div class="grid-stats">
              ${items.map(r => `
                <div class="stat-box">
                  <div class="label">${esc(r.k)}</div>

                  <div class="note">${esc(r.n)}</div>
                </div>
              `).join("")}

          </div>
        </section>`;
    }
  }

  // 2. Market & Colors
  if (show("market")) {
    const cards = t.marketCards.filter(c => matchesSearch(`${t.marketHead} ${c.title} ${c.items.join(" ")}`));
    const colorsMatch = matchesSearch(`${t.colorsTitle} color pintar ${COLORS.map(c => `${c.id} ${c.es} ${c.en}`).join(" ")}`);
    if (cards.length || colorsMatch) {
      visibleSections++;
      html += `
        <section class="section-card">
          <div class="section-banner" style="background-image:url('img/market-oasis.svg');">
            <h2>${esc(t.marketHead)}</h2>
            <span class="pill pill-emerald">${esc(t.marketPill)}</span>
          </div>
          <div class="section-body">
            ${cards.length ? `<div class="grid-2">${cards.map(c => `
              <div class="feature-box">
                <h3>${esc(c.title)}</h3>
                <ul>${c.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
              </div>
            `).join("")}</div>` : ""}
            ${colorsMatch ? `
              <div style="margin-top:20px;">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
                  <div style="font-size:0.88rem;color:var(--muted);font-weight:600;">${esc(t.colorsTitle)}</div>
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <span style="font-size:0.78rem;color:var(--muted);">${lang === 'es' ? 'Región:' : 'Region:'}</span>
                    ${[0,1,2,3,4,5].map(r => `
                      <button class="nav-btn ${colorRegion === r ? 'active' : ''}" style="padding:3px 10px;font-family:var(--mono);" onclick="setColorRegion(${r})">${r}</button>
                    `).join("")}
                  </div>
                </div>
                <div class="swatches">
                  ${COLORS.map(c => `
                    <div class="swatch" onclick="copyText('/color ${colorRegion} ${c.id}')">
                      <span class="dot" style="background:${c.hex}"></span>
                      <span><b>${c.id}</b> · ${esc(c[lang])}</span>
                    </div>
                  `).join("")}
                </div>
              </div>` : ""}
          </div>
        </section>`;
    }
  }

  // 2.5 VALHALLA Dedicated Weekend Mega-Event Section
  if (show("valhalla")) {
    const vHay = `${t.valhallaHead} ${t.valhallaIntro} ${t.valhallaArenas.map(a => `${a.k} ${a.v} ${a.n}`).join(" ")} ${t.valhallaPhases.map(p => `${p.k} ${p.v} ${p.n}`).join(" ")} ${t.valhallaCards.map(c => `${c.title} ${c.items.join(" ")}`).join(" ")}`;

      visibleSections++;
      html += `
        <section class="section-card" style="border-color:rgba(230,185,106,0.38);">
          <div class="section-banner" style="min-height:225px;background-image:url('img/valhalla-arena.svg');">
            <h2>${esc(t.valhallaHead)}</h2>
            <span class="pill pill-gold">${esc(t.valhallaPill)}</span>
          </div>
          <div class="section-body">
            <p class="editorial-lead">${esc(t.valhallaIntro)}</p>
            <div class="grid-stats" style="margin-bottom:20px;">
              ${t.valhallaArenas.map(a => `
                <div class="stat-box" style="border-color:rgba(112,198,245,0.28);background:linear-gradient(180deg, rgba(112,198,245,0.06), rgba(11,10,13,0.56));">

  // 3. Events & Top

          </div>

    }
  }

  // 5. Player Commands
  if (show("commands")) {
    const cmds = t.commands.filter(c => matchesSearch(`${t.cmdsHead} ${c.cmd} ${c.cat} ${c.desc} ${c.kw || ""}`));
    if (cmds.length) {
      visibleSections++;
      html += `
        <section class="section-card">
          <div class="section-head">
            <h2>${esc(t.cmdsHead)}</h2>
            <span class="pill pill-emerald">${esc(t.cmdsPill)}</span>

          <div class="cmd-list">
            ${cmds.map(c => {
              const safe = c.copy.replace(/\\/g, "\\\\").replace(/'/g, "\\'");

                <div class="cmd-row">

                    <span class="cmd-code">${esc(c.cmd)}</span>

            }).join("")}

        </section>`;
    }
  }

  // 6. Rules
  if (show("rules")) {
    const rules = t.rules.filter(r => matchesSearch(`${t.rulesHead} ${r}`));
    if (rules.length) {
      visibleSections++;
      html += `
        <section class="section-card">
          <div class="section-head">
            <h2>${esc(t.rulesHead)}</h2>
            <span class="pill pill-amber">${esc(t.rulesPill)}</span>

          <div class="section-body">
            <div class="rules-list">
              ${rules.map((r, i) => `
                <div class="rule-item">
                  <div class="rule-num">0${i + 1}</div>
                  <div>${esc(r)}</div>
                </div>

            </div>
          </div>
        </section>`;
    }
  }

  document.getElementById("appRoot").innerHTML = html;
  document.getElementById("emptyState").style.display = visibleSections === 0 ? "block" : "none";
}

const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", e => { query = e.target.value; render(); });
document.getElementById("clearBtn").addEventListener("click", () => {
  query = ""; searchInput.value = ""; activeTab = "all"; render(); searchInput.focus();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { query = ""; searchInput.value = ""; activeTab = "all"; render(); }
  else if (e.key === "/" && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
});

render();
</script>
